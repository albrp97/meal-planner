[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "0.1.0"
description = "Local terminal-first smart meal planner for Lidl Prague 2026 prices."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27", "pydantic>=2"]
ui = ["rich>=13", "textual>=0.86"]
youtube = ["yt-dlp>=2025.1", "youtube-transcript-api>=0.6"]
transcribe = ["faster-whisper>=1.0"]
dev = [
    "bandit[toml]>=1.7",
    "coverage[toml]>=7.6",
    "pip-audit>=2.7",
    "ruff>=0.4",
]

[project.scripts]
meal-planner = "meal_planner.cli:main"
meal = "meal_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["meal_planner"]
omit = [
    "src/meal_planner/cli.py",
    "src/meal_planner/llm_client.py",
    "src/meal_planner/tui.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.bandit]
exclude_dirs = [".venv", "build", "dist", "tests"]
skips = ["B101"]
